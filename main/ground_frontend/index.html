<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Helios Ground</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./static/style.css">
  </head>
    <body>
      
      <div class="container text-center">
        <div id="top-bar" class="row">
          <div class="col">
            Helios
          </div>
          <div class="col">
            <img src="https://i.pinimg.com/736x/ed/de/89/edde897bf47591b076ebea01ca370bc8.jpg" width=30 height=40>
          </div>
        </div>
          
          
        <div id="mainBox" class="row">
          

          <div id="chartPanel" class="col panel">
            <div class="chart card row"><canvas id="altitude"></canvas></div>
            <div class="chart card row"><canvas id="temperature"></canvas></div>
            <div class="chart card row"><canvas id="batteryVoltage"></canvas></div>
          </div>
          
          <div id="CanSatModelPanel" class="col panel">
            <div id="table-l" class="row card">
              <table class="table table-sm">
                <tbody>
                  <tr>
                    <td>Time (s)</td>
                    <td id="timeVal">...</td>
                  </tr>
                  <tr>
                    <td>Panel 1 Voltage (v)</td>
                    <td id="P1Val">...</td>
                  </tr>
                  <tr>
                    <td>Panel 2 Voltage (v)</td>
                    <td id="P2Val">...</td>
                  </tr>
                  <tr>
                    <td>Acceleration X (m/s2)</td>
                    <td id="accelXVal">...</td>
                  </tr>
                  <tr>
                    <td>Acceleration Y (m/s2)</td>
                    <td id="accelYVal">...</td>
                  </tr>
                  <tr>
                    <td>Acceleration Z (m/s2)</td>
                    <td id="accelZVal">...</td>
                  </tr>
                </tbody>
              </table>
            </div>
            
            <div id="CanSatModelSection" class="row card">
              <model-viewer id="CanSatModel" src="static/payload.gltf" interpolation-decay="250"></model-viewer>
            </div>
          </div>
          
          <div id="mapPanel" class="col panel">
            <div id="table-r" class="row card">
              <table class="table table-sm">
                <tbody>
                  <tr>
                    <td>Team (#)</td>
                    <td id="idVal">1</td>
                  </tr>
                  <tr>
                    <td>Packet Count (#)</td>
                    <td id="packetCountVal">...</td>
                  </tr>
                  <tr>
                    <td>Latitude (D.D°)</td>
                    <td id="latVal">...</td>
                  </tr>
                  <tr>
                    <td>Longitude (D.D°)</td>
                    <td id="longVal">...</td>
                  </tr>
                  <tr>
                    <td>Sats Used (#)</td>
                    <td id="satsUsedVal">...</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div id="map" class="row card"></div> 
          </div>
          
          <div id="buttonPanel" class="col panel"> 
            <div class="card row list-group" role="group">
              <button type="button" class="list-group-item list-group-item-action list-group-item-primary" id="txOnBut">Telemetry On</button>
              <button type="button" class="list-group-item list-group-item-action list-group-item-primary" id="calBut">Calibrate</button>
            </div>

            <div class="card row list-group" role="group">
              <button type="button" class="list-group-item list-group-item-action list-group-item-danger" id="releaseBut">Release</button>
              <button type="button" class="list-group-item list-group-item-action list-group-item-danger" id="extensionBut">Panel Extension</button>
            </div>
            
            <div class="card row list-group">
              <button type="button" class="list-group-item list-group-item-action active" id="s0But">Pre-Flight</button>
              <button type="button" class="list-group-item list-group-item-action" id="s1But">Ascent</button>
              <button type="button" class="list-group-item list-group-item-action" id="s2But">Apogee</button>
              <button type="button" class="list-group-item list-group-item-action" id="s3But">Descent</button>
              <button type="button" class="list-group-item list-group-item-action" id="s4But">Landed</button>
            </div>

            <div class="card row list-group" role="group">
              <button type="button" class="list-group-item list-group-item-action list-group-item-danger"
                id="LebronBut">Lebron</button>
            </div>
            
            
          </div>
          
        </div>
        
      </div>

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<script nomodule src="https://unpkg.com/@google/model-viewer/dist/model-viewer-legacy.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-alpha.1/dist/leaflet.css" integrity="sha256-P+hWJNlpL+GBSRYC7cdsDbQH91URmpDeOzLp7DbFRtE=" crossorigin="anonymous" />

<script type="importmap">
{
    "imports": {
        "leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-alpha.1/dist/leaflet.js"
    },
    "integrity": {
        "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-alpha.1/dist/leaflet.js": "sha256-gj5JhNAaMi6LCs+jVFOk8sXDe1sWSS2Zlc87m+trLiQ="
    }
}
</script>
    <script type="module" src="./static/script.js"></script>
  </body>
</html>
